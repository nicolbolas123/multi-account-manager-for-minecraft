# Builds the app for Apple silicon and Intel, each on a native GitHub-hosted runner, runs the
# tests and the bundle checks, and uploads the release zips as workflow artifacts.
# It never creates, edits or publishes a GitHub release: download the artifacts from the run's
# summary page, test them, and attach them to a release by hand (docs/DISTRIBUTING.md).
name: Build macOS apps

on:
  workflow_dispatch:          # "Run workflow" button on the Actions tab
  push:
    tags: ["v*", "!v*-windows*"]  # also build when a version tag is pushed (not Windows previews)

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            label: Apple silicon
          - runner: macos-15-intel
            arch: x86_64
            label: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6.1.0

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.14"   # keep in step with docs/DISTRIBUTING.md

      - name: Check that the runner is a native ${{ matrix.arch }} Mac
        run: |
          echo "Runner: $(uname -m), macOS $(sw_vers -productVersion), $(python3 --version)"
          test "$(uname -m)" = "${{ matrix.arch }}"

      - name: Build, test and verify
        run: packaging/build_app.sh --arch ${{ matrix.arch }}

      - name: Package release zip
        run: packaging/make_release.sh dist/${{ matrix.arch }}/*.app

      # GitHub's artifact storage occasionally times out (seen on the first v0.2.0 run, after the
      # build and every check had passed), so a failed upload is retried once after a pause.
      - name: Upload release zip
        id: upload
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macOS-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

      - name: Wait before retrying the upload
        if: steps.upload.outcome == 'failure'
        run: sleep 60

      - name: Upload release zip (retry)
        if: steps.upload.outcome == 'failure'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macOS-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error
          overwrite: true
